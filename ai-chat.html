<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Helper - 1st Year Notes</title>
  <link rel="stylesheet" href="css/ai-chat.css" />
  <script>
    if (localStorage.getItem("isLoggedIn") !== "true") {
      window.location.href = "login.html";
    }
  </script>
</head>
<body>
  <div class="page-wrapper">
    <header class="top-bar">
      <a href="index.html" class="back-link">← Back to Notes</a>
      <div class="title">AI Study Assistant</div>
      <span class="status-pill">Online</span>
    </header>

    <main class="chat-wrapper">
      <div class="chat-box" id="chatBox">
        <div class="msg bot">
          <div class="msg-bubble">
            Hi 👋 Main tumhara AI study assistant hoon. Tum mujhe subjects, formulas, important topics, ya PYQ ke baare me kuch bhi puch sakte ho.
          </div>
        </div>
      </div>

      <form id="chatForm" class="chat-input-area">
        <input
          type="text"
          id="chatInput"
          placeholder="Type your question here... (e.g. 'EM ke important topics batao')"
          autocomplete="off"
          required
        />
        <button type="submit">Send</button>
      </form>
    </main>
  </div>

  <script src="js/ai-chat.js"></script>
</body>
</html>
